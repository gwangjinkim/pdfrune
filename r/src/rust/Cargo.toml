[workspace]
members = [
    ".",
    "pdfrune",
]

[package]
name = "pdfrune-r"
version = "0.1.0"
edition = "2021"
authors = ["Gwang-Jin Kim <gwang.jin.kim.phd@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "pdfrune_r"
crate-type = ["staticlib"]

[dependencies]
pdfrune = { path = "pdfrune" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
