[workspace]
members = [
    ".",
    "rupdf-core",
]

[package]
name = "rupdf-r"
version = "0.1.0"
edition = "2021"
authors = ["Gwang-Jin Kim <gwang.jin.kim.phd@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "rupdf_r"
crate-type = ["staticlib"]

[dependencies]
rupdf-core = { path = "rupdf-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
