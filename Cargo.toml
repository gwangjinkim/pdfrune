[workspace]
resolver = "2"
members = [
    "crates/rupdf-core",
    "crates/rupdf-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["rupdf contributors"]
repository = "https://github.com/rupdf/rupdf"

[workspace.dependencies]
thiserror = "2.0"
flate2 = "1.1"
memchr = "2.8"
rayon = "1.12"
pyo3 = { version = "0.23.5", features = ["extension-module", "abi3-py310"] }
rupdf-core = { path = "crates/rupdf-core" }
